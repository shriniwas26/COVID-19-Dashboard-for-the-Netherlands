services:
  dashboard:
    platform: linux/amd64
    restart: "no"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard
    ports:
      - 8080:8080
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./covid_dashboard_nl.py:/app/covid_dashboard_nl.py
      - ./update_data.py:/app/update_data.py
      - ./data:/app/data
      - ./assets:/app/assets
    # command:
